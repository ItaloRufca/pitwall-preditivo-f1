{% extends "base.html" %}

{% block content %}
<div class="max-w-7xl mx-auto space-y-2">
    <header class="flex justify-between items-center glass px-6 py-4 rounded-b-2xl mb-4">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🏎️</span>
            <div>
                <h1
                    class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-red-500 to-orange-500 leading-tight">
                    Pitwall Preditivo <span class="text-white font-light opacity-80">Next Gen</span>
                </h1>
            </div>
        </div>

        <!-- Compact Form -->
        <form hx-post="/predict" hx-target="#results-area" hx-indicator="#loading" class="flex items-center gap-2">
            <!-- Removed Year Selector as per User Request -->
            <input type="hidden" name="year" value="0">

            <select name="meeting_key"
                class="bg-neutral-900 border border-neutral-700 text-white text-sm rounded-lg px-3 py-2 w-72 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-colors">
                {% for circuit in circuits %}
                <option value="{{ circuit.key }}">{{ circuit.name }}</option>
                {% endfor %}
            </select>

            <!-- Weather Slider (Intuitive) -->
            <div class="flex items-center gap-3 px-4 border-l border-white/10 group relative">
                <span class="text-lg grayscale group-hover:grayscale-0 transition-all">☀️</span>

                <div class="flex flex-col items-center w-32">
                    <input type="range" name="rain_prob" min="0" max="100" value="0"
                        class="w-full h-1.5 bg-neutral-700 rounded-lg appearance-none cursor-pointer accent-blue-500 hover:accent-blue-400 transition-all"
                        oninput="document.getElementById('rain-val').innerText = this.value + '%'; document.getElementById('rain-label').innerText = this.value > 50 ? 'Chuva' : 'Seco'">

                    <div class="flex justify-between w-full text-[9px] uppercase font-bold text-gray-500 mt-1">
                        <span id="rain-label">Seco</span>
                        <span id="rain-val" class="text-blue-400">0%</span>
                    </div>
                </div>

                <span class="text-lg grayscale group-hover:grayscale-0 transition-all">🌧️</span>
            </div>

            <button type="submit"
                class="p-2 bg-red-600 rounded-full hover:bg-red-700 text-white shadow-lg transition-transform hover:scale-105 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </button>
        </form>
    </header>

    <!-- Loading State -->
    <div id="loading" class="htmx-indicator flex justify-center py-4">
        <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-red-500"></div>
    </div>

    <!-- Results Injection Area -->
    <div id="results-area" class="transition-all duration-500 ease-in-out min-h-[500px]">
        <!-- Initial Blank State - Removed massive padding -->
    </div>
</div>
{% endblock %}
