<div id="modal-backdrop"
    class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in"
    onclick="closeModal()">
    <div class="bg-neutral-900 border border-neutral-700 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden m-4 shadow-2xl relative"
        onclick="event.stopPropagation()">

        <!-- Header -->
        <div class="bg-neutral-800 px-6 py-4 flex justify-between items-center border-b border-neutral-700">
            <h3 class="text-xl font-bold text-white flex items-center gap-2">
                <span class="text-white text-2xl">+</span> Selecionar Oponente
            </h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Drivers Grid -->
        <div class="p-6 overflow-y-auto max-h-[70vh] grid grid-cols-3 sm:grid-cols-4 gap-4">
            {% for d in drivers %}
            <div hx-post="/compare" hx-target="#modal-container" hx-swap="innerHTML"
                hx-vals='{"d1": "{{ current_driver }}", "d2": "{{ d.number }}", "meeting_key": "{{ meeting_key }}"}'
                hx-indicator="#loading-{{ d.number }}"
                class="group bg-neutral-800 hover:bg-neutral-700 border border-transparent hover:border-red-500 rounded-lg p-3 text-center cursor-pointer transition-all relative">

                <!-- Loading Overlay for this item -->
                <div id="loading-{{ d.number }}"
                    class="htmx-indicator absolute inset-0 bg-black/60 flex items-center justify-center rounded-lg z-10">
                    <div class="animate-spin h-6 w-6 border-2 border-white border-t-transparent rounded-full"></div>
                </div>

                <div class="w-16 h-16 rounded-full mx-auto overflow-hidden bg-neutral-900 border-2 mb-2 group-hover:scale-110 transition-transform relative"
                    style="border-color: {{ d.team_color }}">
                    {% if d.img %}
                    <img src="{{ d.img }}" class="w-full h-full object-cover object-top"
                        onerror="this.onerror=null; this.parentElement.innerHTML='<svg xmlns=\'http://www.w3.org/2000/svg\' class=\'w-full h-full p-2 text-gray-500\' fill=\'currentColor\' viewBox=\'0 0 24 24\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'">
                    {% else %}
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-full h-full p-2 text-gray-500" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                    {% endif %}

                    <!-- Number Badge -->
                    <div class="absolute bottom-0 right-0 w-6 h-6 rounded-full bg-neutral-900 border flex items-center justify-center text-[10px] font-bold text-white shadow-md z-10"
                        style="border-color: {{ d.team_color }}; color: {{ d.team_color }};">
                        {{ d.number }}
                    </div>
                </div>

                <div class="font-bold text-white text-sm leading-tight px-1">{{ d.full_name }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<script>
    function closeModal() {
        document.getElementById('modal-backdrop').remove();
    }
</script>
